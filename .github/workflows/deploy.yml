name: Deploy Finmatrix to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Sync to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔍 Find Exact Live Web Root
        id: probe
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*//||' -e 's|/.*$||' | tr -d '[:space:]')
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT
          
          npm install --no-save basic-ftp
          node -e "
            const ftp = require('basic-ftp');
            const fs = require('fs');
            const stream = require('stream');

            async function probe() {
              const client = new ftp.Client();
              let verifiedTarget = '';

              try {
                await client.access({
                  host: '$CLEAN_SERVER',
                  user: process.env.FTP_USER,
                  password: process.env.FTP_PASS,
                  port: 21,
                  secure: false
                });

                const rootList = await client.list();
                const names = rootList.map(f => f.name);
                console.log('Root directory entries:', names.join(', '));

                // Candidate paths to test
                const candidates = [
                  'public_html/',
                  './',
                  'domains/finmatrix.cloud/public_html/',
                  'domains/finmatrix.cloud/',
                  'finmatrix.cloud/public_html/'
                ];

                // If domains exists, add any actual folder found under domains/
                if (names.includes('domains')) {
                  try {
                    const doms = await client.list('domains');
                    for (const d of doms) {
                      candidates.push('domains/' + d.name + '/public_html/');
                      candidates.push('domains/' + d.name + '/');
                    }
                  } catch(e){}
                }

                console.log('Testing candidates:', candidates);

                const testToken = 'probe_' + Date.now();
                const testFileName = 'finmatrix_probe.txt';

                for (const cand of candidates) {
                  try {
                    const targetFile = (cand.endsWith('/') ? cand : cand + '/') + testFileName;
                    console.log('Testing upload to:', targetFile);
                    
                    const s = new stream.Readable();
                    s.push(testToken);
                    s.push(null);
                    
                    await client.uploadFrom(s, targetFile);
                    
                    // Wait 1 second and check via HTTP
                    await new Promise(r => setTimeout(r, 1500));
                    const res = await fetch('https://finmatrix.cloud/' + testFileName + '?t=' + Date.now());
                    if (res.status === 200) {
                      const txt = await res.text();
                      if (txt.includes(testToken)) {
                        console.log('🎉 FOUND MATCH! Live web root is:', cand);
                        verifiedTarget = cand;
                        // Clean up probe file
                        try { await client.remove(targetFile); } catch(e){}
                        break;
                      }
                    } else {
                      console.log('HTTP returned', res.status, 'for candidate', cand);
                    }
                    // Clean up candidate test file
                    try { await client.remove(targetFile); } catch(e){}
                  } catch(err) {
                    console.log('Candidate failed:', cand, err.message);
                  }
                }
              } catch(e) {
                console.error('Probe error:', e.message);
              } finally {
                client.close();
                if (!verifiedTarget) {
                  verifiedTarget = 'public_html/';
                  console.log('No HTTP probe match found, falling back to public_html/');
                }
                fs.appendFileSync(process.env.GITHUB_OUTPUT, 'target_dir=' + verifiedTarget + '\n');
                console.log('VERIFIED TARGET DIR:', verifiedTarget);
              }
            }
            probe();
          "
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}

      - name: 📤 Sync Files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.probe.outputs.clean_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.probe.outputs.target_dir }}
          dangerous-clean-slate: false
          protocol: ftp
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/workflows/**
            **/tests/**
            **/src/**
            **/scripts/**
            package.json
            package-lock.json
            README.md
            ELI5_GUIDE.md
            PLAYBOOK.md
            GROWTH_ROUTINE.md
            *.py
            *.zip
