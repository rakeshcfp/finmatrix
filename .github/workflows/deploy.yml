name: Deploy Finmatrix to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Sync to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🔍 Detect Hostinger Target Directory
        id: detect
        run: |
          RAW_SERVER="${{ secrets.FTP_SERVER }}"
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -e 's|^[^/]*//||' -e 's|/.*$||' | tr -d '[:space:]')
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT
          
          npm install --no-save basic-ftp
          node -e "
            const ftp = require('basic-ftp');
            const fs = require('fs');

            async function detect() {
              const client = new ftp.Client();
              client.ftp.verbose = false;
              let targetDir = 'public_html/';

              try {
                await client.access({
                  host: '$CLEAN_SERVER',
                  user: process.env.FTP_USER,
                  password: process.env.FTP_PASS,
                  port: 21,
                  secure: false
                });

                const pwd = await client.pwd();
                console.log('📍 Current working directory (PWD):', pwd);
                const rootList = await client.list();
                const names = rootList.map(f => f.name);
                console.log('📁 Root items:', names.join(', '));

                // Case 1: Already inside finmatrix web root
                if (names.includes('calculators') || names.includes('articles') || names.includes('downloads')) {
                  targetDir = './';
                  console.log('🎯 Detected: FTP root is ALREADY web root! Using: ./');
                }
                // Case 2: Hostinger multi-domain structure (domains/finmatrix.cloud/public_html)
                else if (names.includes('domains')) {
                  const domList = await client.list('domains');
                  console.log('📁 domains/ list:', domList.map(f => f.name).join(', '));
                  const match = domList.find(d => d.name.toLowerCase().includes('finmatrix'));
                  if (match) {
                    targetDir = 'domains/' + match.name + '/public_html/';
                    console.log('🎯 Detected Hostinger addon domain! Using:', targetDir);
                  } else {
                    targetDir = 'public_html/';
                    console.log('🎯 Fallback to public_html/');
                  }
                }
                // Case 3: Standard single domain public_html
                else if (names.includes('public_html')) {
                  targetDir = 'public_html/';
                  console.log('🎯 Detected standard public_html/');
                } else {
                  targetDir = './';
                  console.log('🎯 Fallback to: ./');
                }
              } catch(err) {
                console.error('Detection error:', err.message);
              } finally {
                client.close();
                const outLine = 'target_dir=' + targetDir;
                fs.appendFileSync(process.env.GITHUB_OUTPUT, outLine + '\n');
                console.log('FINAL SELECTED TARGET:', targetDir);
              }
            }
            detect();
          "
        env:
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}

      - name: 📤 Sync Files to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.detect.outputs.clean_server }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.detect.outputs.target_dir }}
          protocol: ftp
          timeout: 60000
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/workflows/**
            **/tests/**
            **/src/**
            **/scripts/**
            package.json
            package-lock.json
            README.md
            ELI5_GUIDE.md
            PLAYBOOK.md
            GROWTH_ROUTINE.md
            *.py
            *.zip
