name: Deploy Finmatrix to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    name: 🚀 Sync to Hostinger
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📥 Install basic-ftp
        run: npm install basic-ftp

      - name: 🔍 Debug FTP Paths
        run: node scripts/debug-ftp.js
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

      - name: 📝 Commit Diagnostic Result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ftp-diagnostic.json
          git commit -m "chore: record FTP diagnostic tree [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"
